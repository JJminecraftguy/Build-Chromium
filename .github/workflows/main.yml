name: build-chrome-0.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      # ── 1. Setup Go (required by setup-msvc v1.1.0) ────────────
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # ── 2. Setup MSVC 2005 SP1 ─────────────────────────────────
      - name: Setup MSVC 2005 SP1
        uses: jaenster/setup-msvc@v1
        with:
          version: '14.00.50727.762'

      - name: Verify compiler
        shell: pwsh
        run: cl.exe /?

      - name: Extract Vista SDK headers & libs
        shell: pwsh
        run: |
          curl.exe -L -o "$env:RUNNER_TEMP\vista_sdk.iso" `
            "http://download.microsoft.com/download/4/2/6/42684501-9ec5-43dd-9dfe-c8c9dfa6a66f/6.1.6000.16384.10.WindowsSDK_Vista_Feb2007Update_rtm.DVD.Rel.iso"
          if ((Get-Item "$env:RUNNER_TEMP\vista_sdk.iso").Length / 1GB -lt 1.0) {
            Write-Error "ISO too small"
            exit 1
          }

          Mount-DiskImage -ImagePath "$env:RUNNER_TEMP\vista_sdk.iso"
          $drive = (Get-DiskImage -ImagePath "$env:RUNNER_TEMP\vista_sdk.iso" | Get-Volume).DriveLetter

          $headersCab = "${drive}:\Setup\WinSDKBuild-WinSDKBuild_VistaHeaders-common.0.cab"
          $libsCab    = "${drive}:\Setup\WinSDKBuild-WinSDKBuild_VistaLibs_X86-common.0.cab"

          # Show what's inside so we can see the path structure
          Write-Host "`nHeaders cabinet contents:"
          7z l $headersCab

          Write-Host "`nLibs cabinet contents:"
          7z l $libsCab

          # Extract everything from both (they're tiny)
          New-Item -ItemType Directory -Force -Path sdk-v6.1
          7z x $headersCab -o"sdk-v6.1" -y
          7z x $libsCab -o"sdk-v6.1" -y

          Dismount-DiskImage -ImagePath "$env:RUNNER_TEMP\vista_sdk.iso"
          Remove-Item "$env:RUNNER_TEMP\vista_sdk.iso" -Force

          # Find where windows.h landed
          $wh = Get-ChildItem "sdk-v6.1" -Recurse -Filter "windows.h" | Select-Object -First 1
          if (-not $wh) {
            Write-Host "sdk-v6.1 tree:"
            Get-ChildItem "sdk-v6.1" -Recurse -Depth 3 | ForEach-Object { Write-Host "  $($_.FullName)" }
            Write-Error "windows.h not found"
            exit 1
          }
          Write-Host "`nwindows.h at: $($wh.FullName)"

          # Set PLATFORMSDK_6_1 to the root that the SConscript expects
          # (the dir that contains Include/ and Lib/ as subdirs)
          $sdkRoot = $wh.Directory.Parent.FullName
          Write-Host "SDK root: $sdkRoot"
          echo "PLATFORMSDK_6_1=$sdkRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # Also append to INCLUDE and LIB for the compiler
          $includeDir = $wh.Directory.FullName
          $libDir = Get-ChildItem "sdk-v6.1" -Recurse -Directory -Filter "Lib" | Select-Object -First 1
          if ($libDir) {
            echo "INCLUDE=$includeDir;$($env:INCLUDE)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            echo "LIB=$($libDir.FullName);$($env:LIB)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          Write-Host "Done."
          
      - name: Set Vista SDK env vars
        shell: pwsh
        run: |
          echo "PLATFORMSDK_6_1=$PWD\sdk-v6.1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "INCLUDE=$PWD\sdk-v6.1\Include;$($env:INCLUDE)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "LIB=$PWD\sdk-v6.1\Lib;$($env:LIB)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "PATH=$PWD\sdk-v6.1\bin;$($env:PATH)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "SDK at: $env:PLATFORMSDK_6_1"

      # ── 4. DirectX 9.0c SDK headers (Dec 2006) ─────────────────
      - name: Cache DX9 headers
        id: cache-dx9
        uses: actions/cache/restore@v4
        with:
          path: dx9-sdk
          key: dx9-sdk-dec2006
          restore-keys: dx9-sdk-

      - name: Extract DirectX 9.0c SDK headers (Dec 2006)
        if: steps.cache-dx9.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -L -o "$env:RUNNER_TEMP\dxsdk_dec2006.exe" `
            "https://archive.org/download/dxsdk_dec2006/dxsdk_dec2006.exe"

          # Step 1: Extract the inner .cab from the PE self-extractor
          7z x "$env:RUNNER_TEMP\dxsdk_dec2006.exe" -o"$env:RUNNER_TEMP\dx_cab" -y

          # Find the cab
          $cab = Get-ChildItem "$env:RUNNER_TEMP\dx_cab" -Filter "*.cab" -Recurse | Select-Object -First 1
          if (-not $cab) {
            $cab = Get-ChildItem "$env:RUNNER_TEMP\dx_cab" -Recurse | Where-Object { $_.Length -gt 100MB } | Select-Object -First 1
          }
          Write-Host "CAB: $($cab.FullName) ($([math]::Round($cab.Length/1MB,1)) MB)"

          # Step 2: Extract only Include and Lib from the cab
          7z x $cab.FullName "Include" -o"$env:RUNNER_TEMP\dx" -y
          7z x $cab.FullName "Lib" -o"$env:RUNNER_TEMP\dx" -y

          # Cleanup
          Remove-Item "$env:RUNNER_TEMP\dxsdk_dec2006.exe" -Force
          Remove-Item "$env:RUNNER_TEMP\dx_cab" -Recurse -Force
          Move-Item "$env:RUNNER_TEMP\dx" "dx9-sdk"

          # Verify
          $d3d9 = Get-ChildItem "dx9-sdk" -Recurse -Filter "d3d9.h" | Select-Object -First 1
          if (-not $d3d9) {
            Write-Error "d3d9.h NOT found"
            exit 1
          }
          Write-Host "Found d3d9.h at: $($d3d9.FullName)"

      - name: Save DX9 cache
        if: steps.cache-dx9.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dx9-sdk
          key: dx9-sdk-dec2006

      - name: Set DX9 env vars
        shell: pwsh
        run: |
          echo "INCLUDE=$PWD\dx9-sdk\Include;$($env:INCLUDE)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "LIB=$PWD\dx9-sdk\Lib;$($env:LIB)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # ── 5. Fetch Chromium dependencies ─────────────────────────

      # --- Breakpad ---
      - name: Restore Breakpad cache
        id: breakpad-cache
        uses: actions/cache/restore@v4
        with:
          path: src/breakpad/src
          key: breakpad-2d7664e8d477816e0641e822752f63982c1be74f

      - name: Clone Breakpad (if not cached)
        if: steps.breakpad-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-tags --single-branch -b main --no-checkout https://github.com/google/breakpad.git breakpad
          cd breakpad
          git checkout 2d7664e8d477816e0641e822752f63982c1be74f
          git gc --aggressive --prune=now
          cd ..
          Remove-Item -Recurse -Force breakpad\.git
          New-Item -ItemType Directory -Force -Path src\breakpad
          Move-Item -Path breakpad -Destination src\breakpad\src

      - name: Save Breakpad cache
        if: steps.breakpad-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: src/breakpad/src
          key: breakpad-2d7664e8d477816e0641e822752f63982c1be74f

      # --- Googletest ---
      - name: Restore Googletest cache
        id: gtest-cache
        uses: actions/cache/restore@v4
        with:
          path: src/testing/gtest
          key: googletest-26ddf828fa2870982315f4dc8dd4f6e4777f4d29

      - name: Clone Googletest (if not cached)
        if: steps.gtest-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-tags --single-branch -b master --no-checkout https://github.com/stp/googletest.git googletest
          cd googletest
          git checkout 26ddf828fa2870982315f4dc8dd4f6e4777f4d29
          git gc --aggressive --prune=now
          cd ..
          Remove-Item -Recurse -Force googletest\.git
          New-Item -ItemType Directory -Force -Path src\testing
          Move-Item -Path googletest -Destination src\testing\gtest

      - name: Save Googletest cache
        if: steps.gtest-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: src/testing/gtest
          key: googletest-26ddf828fa2870982315f4dc8dd4f6e4777f4d29

      # --- V8 ---
      - name: Restore V8 cache
        id: v8-cache
        uses: actions/cache/restore@v4
        with:
          path: src/v8
          key: v8-4de96712f4295f4e5deaadc5d8a7429889eee00b

      - name: Clone V8 (if not cached)
        if: steps.v8-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-tags --single-branch -b main --no-checkout https://chromium.googlesource.com/v8/v8.git v8
          cd v8
          git checkout 4de96712f4295f4e5deaadc5d8a7429889eee00b
          git gc --aggressive --prune=now
          cd ..
          Remove-Item -Recurse -Force v8\.git
          New-Item -ItemType Directory -Force -Path src
          Move-Item -Path v8 -Destination src\v8

      - name: Save V8 cache
        if: steps.v8-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: src/v8
          key: v8-4de96712f4295f4e5deaadc5d8a7429889eee00b

      # --- WebKit LayoutTests ---
      - name: Restore WebKit cache
        id: webkit-cache
        uses: actions/cache/restore@v4
        with:
          path: src/webkit/data/layout_tests
          key: webkit-safari31-r31256

      - name: Clone WebKit LayoutTests (if not cached)
        if: steps.webkit-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          git clone --filter=blob:none --no-tags --single-branch -b Safari-3-1-branch --no-checkout https://chromium.googlesource.com/external/Webkit WebKit
          cd WebKit
          git checkout d48ae3e98a7de1e687103a8a172d911bf764a90a -- LayoutTests
          cd ..
          New-Item -ItemType Directory -Force -Path src\webkit\data
          Move-Item -Path WebKit\LayoutTests -Destination src\webkit\data\layout_tests
          Remove-Item -Recurse -Force WebKit

      - name: Save WebKit cache
        if: steps.webkit-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: src/webkit/data/layout_tests
          key: webkit-safari31-r31256

      # --- Google URL (svndump) ---
      - name: Restore Google URL cache
        id: googleurl-cache
        uses: actions/cache/restore@v4
        with:
          path: src/googleurl
          key: googleurl-r92

      - name: Setup SVN
        if: steps.googleurl-cache.outputs.cache-hit != 'true'
        uses: AmpScm/setup-subversion@v1

      - name: Fetch Google URL (if not cached)
        if: steps.googleurl-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://storage.googleapis.com/google-code-archive-source/v2/code.google.com/google-url/repo.svndump.gz" -OutFile "$env:RUNNER_TEMP\google-url.svndump.gz"
          7z x "$env:RUNNER_TEMP\google-url.svndump.gz" -o"$env:RUNNER_TEMP" -y
          svnadmin create "$env:RUNNER_TEMP\google-url-svn"
          cmd /c "svnadmin load ""$env:RUNNER_TEMP\google-url-svn"" < ""$env:RUNNER_TEMP\google-url.svndump"""
          New-Item -ItemType Directory -Force -Path src
          svn checkout "file:///$($env:RUNNER_TEMP.Replace('\','/'))/google-url-svn/trunk@92" src\googleurl

      - name: Save Google URL cache
        if: steps.googleurl-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: src/googleurl
          key: googleurl-r92

      # --- ICU 3.8.1 ---
      - name: Restore ICU cache
        id: icu-cache
        uses: actions/cache/restore@v4
        with:
          path: src/third_party/icu38
          key: icu38-3.8.1

      - name: Fetch ICU 3.8.1 (if not cached)
        if: steps.icu-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -L -o "$env:RUNNER_TEMP\icu4c-3_8_1-src.tgz" "https://downloads.sourceforge.net/project/icu/ICU4C/3.8.1/icu4c-3_8_1-src.tgz"
          7z x "$env:RUNNER_TEMP\icu4c-3_8_1-src.tgz" -o"$env:RUNNER_TEMP\icu" -y
          7z x "$env:RUNNER_TEMP\icu\icu4c-3_8_1-src.tar" -o"$env:RUNNER_TEMP\icu" -y

          $src = "$env:RUNNER_TEMP\icu\icu\source"
          New-Item -ItemType Directory -Force -Path src\third_party\icu38\public
          Copy-Item -Recurse "$src\common" src\third_party\icu38\public\common
          Copy-Item -Recurse "$src\i18n" src\third_party\icu38\public\i18n
          Move-Item -Path $src -Destination src\third_party\icu38\source

          if (-not (Test-Path "src\third_party\icu38\source\data\in\icudt38l.dat")) {
            throw "icudt38l.dat not found in source tree"
          }
          Write-Host ">>> icudt38l.dat present: $((Get-Item 'src\third_party\icu38\source\data\in\icudt38l.dat').Length) bytes"

          curl.exe -L -o "src\third_party\icu38\icu38_main.scons" "https://raw.githubusercontent.com/JJminecraftguy/Build-Chromium/main/icu38_main.scons"
          Remove-Item -Recurse -Force "$env:RUNNER_TEMP\icu"

      - name: Save ICU cache
        if: steps.icu-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: src/third_party/icu38
          key: icu38-3.8.1

      # ── 6. Clone Chromium ──────────────────────────────────────
      - name: Clone Chromium @ 4db48af7
        uses: actions/checkout@v4
        with:
          repository: chromium/chromium
          ref: "4db48af7ca622fe2b6d521abd7116f76e3d9ecb1"
          fetch-depth: 1
          path: chromium

      - name: Show Chromium contents
        shell: pwsh
        run: |
          Get-Content "chromium\chrome\VERSION" -ErrorAction SilentlyContinue
          Get-ChildItem "chromium" -Name | Select-Object -First 20

      # ── 7. Build ───────────────────────────────────────────────
      - name: Build (placeholder)
        shell: pwsh
        run: |
          Write-Host "TODO: add build steps"
          # The SConscript expects:
          #   - PLATFORMSDK_6_1 → set above (points to sdk-v6.1/)
          #   - MSVS_VERSION = '8.0' (set by SConscript.main)
          #   - Visual Studio at C:\Program Files (x86)\Microsoft Visual Studio 8
          #   - Python 2.4 from chromium/third_party/python_24
          #   - All deps under src/ (breakpad, gtest, v8, icu38, googleurl, webkit)
