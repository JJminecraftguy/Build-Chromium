      #   shell: pwsh
      #   run: |
      #     # DXSDK_Jun10.exe is the last official DX SDK (includes DX9/10/11)
      #     curl.exe -L -o "$env:RUNNER_TEMP\DXSDK_Jun10.exe" `
      #       "https://download.microsoft.com/download/a/e/7/ae743f1f-632b-4809-87a9-aa1bb3458e31/DXSDK_Jun10.exe"
      #     7z x "$env:RUNNER_TEMP\DXSDK_Jun10.exe" "DXSDK/Include" -o"$env:RUNNER_TEMP\dx" -y
      #     7z x "$env:RUNNER_TEMP\DXSDK_Jun10.exe" "DXSDK/Lib/x86" -o"$env:RUNNER_TEMP\dx" -y
      #     Remove-Item "$env:RUNNER_TEMP\DXSDK_Jun10.exe" -Force
      #     # Point INCLUDE/LIB at the extracted headers
      #     $include = "$env:RUNNER_TEMP\dx\DXSDK\Include"
      #     $lib = "$env:RUNNER_TEMP\dx\DXSDK\Lib\x86"
      #     echo "INCLUDE=$include;$($env:INCLUDE)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      #     echo "LIB=$lib;$($env:LIB)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      #     Write-Host "DX9 headers at: $include"
      #     Test-Path "$include\d3d9.h"

      # ── 3. Clone Chromium ───────────────────────────────────────
      - name: Clone Chromium @ 4db48af7
        uses: actions/checkout@v4
        with:
          repository: chromium/chromium
          ref: "4db48af7ca622fe2b6d521abd7116f76e3d9ecb1"
          fetch-depth: 1
          path: chromium

      - name: Show Chromium contents
        shell: pwsh
        run: |
          Get-Content "chromium\chrome\VERSION" -ErrorAction SilentlyContinue
          Get-ChildItem "chromium" -Name | Select-Object -First 20

