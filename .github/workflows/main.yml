name: build-chrome-0.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      # ── 1. Free disk space ──────────────────────────────────────
      - name: Remove pre-installed toolchains
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "C:\Program Files\Microsoft Visual Studio\2022" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:AGENT_TOOLSDIRECTORY" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\Google\Chrome" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files (x86)\Microsoft\EdgeCore" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\Mozilla Firefox" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\Java" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\Eclipse Adoptium" -ErrorAction SilentlyContinue
          Write-Host "Freed space:"
          Get-PSDrive C | Select-Object Used, Free

      # ── 2. Enable .NET 3.5 ──────────────────────────────────────
      - name: Enable .NET 3.5
        shell: pwsh
        run: |
          DISM /Online /Enable-Feature /FeatureName:NetFx3 /All /NoRestart
          Write-Host ".NET 3.5 enabled"

      # ── 3. Get VC.ISO ───────────────────────────────────────────
      # Option A: Direct download (simpler, ~430 MB)
      - name: Download VC.ISO (direct)
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\VC.iso"
          curl.exe -L -o "$out" "https://archive.org/download/vs-express-2005/VC.iso"
          $size = (Get-Item $out).Length / 1MB
          Write-Host "Downloaded: $size MB"
          if ($size -lt 400) {
            Write-Error "File too small — likely an HTML error page, not the ISO"
            exit 1
          }

      # Option B: Mount the big EE ISO and extract VC.ISO (use this
      # if the direct URL above 404s or changes)
      # - name: Download VS2005EE.iso
      #   shell: pwsh
      #   run: |
      #     curl.exe -L -o "$env:RUNNER_TEMP\VS2005EE.iso" "https://archive.org/download/mvs-2005-ee/VS2005EE.iso"
      #
      # - name: Mount VS2005EE.iso and extract VC.ISO
      #   shell: pwsh
      #   run: |
      #     $iso = "$env:RUNNER_TEMP\VS2005EE.iso"
      #     Mount-DiskImage -ImagePath $iso
      #     $drive = (Get-DiskImage -ImagePath $iso | Get-Volume).DriveLetter
      #     Write-Host "Mounted at ${drive}:"
      #     Get-ChildItem "${drive}:\\"
      #     Copy-Item "${drive}:\VC.ISO" "$env:RUNNER_TEMP\VC.iso"
      #     Dismount-DiskImage -ImagePath $iso
      #     Remove-Item $iso -Force
      #     Write-Host "Extracted VC.ISO, deleted VS2005EE.iso"

      # ── 4. Mount VC.ISO and install ─────────────────────────────
      - name: Mount VC.ISO
        shell: pwsh
        run: |
          $iso = "$env:RUNNER_TEMP\VC.iso"
          Mount-DiskImage -ImagePath $iso
          $drive = (Get-DiskImage -ImagePath $iso | Get-Volume).DriveLetter
          Write-Host "VC.ISO mounted at ${drive}:"
          Get-ChildItem "${drive}:\\"
          # Save drive letter for next step
          "${drive}" | Out-File -FilePath "$env:RUNNER_TEMP\vc_drive.txt" -Encoding ascii

      - name: Install Visual C++ 2005 Express
        shell: pwsh
        run: |
          $drive = (Get-Content "$env:RUNNER_TEMP\vc_drive.txt").Trim()
          $setup = "${drive}:\setup.exe"
          if (-not (Test-Path $setup)) {
            # Some ISOs use a different entry point
            Get-ChildItem "${drive}:\\" | ForEach-Object { Write-Host $_.Name }
            Write-Error "setup.exe not found on ${drive}:"
            exit 1
          }
          # /passive = unattended with progress, /norestart = no reboot
          & $setup /passive /norestart
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Install failed with exit code $LASTEXITCODE"
            exit $LASTEXITCODE
          }
          Write-Host "VS2005 C++ Express installed"

      - name: Dismount VC.ISO and clean up
        shell: pwsh
        run: |
          $iso = "$env:RUNNER_TEMP\VC.iso"
          Dismount-DiskImage -ImagePath $iso
          Remove-Item $iso -Force
          Remove-Item "$env:RUNNER_TEMP\vc_drive.txt" -Force

      - name: Verify MSVC 2005 compiler
        shell: pwsh
        run: |
          $cl = "C:\Program Files (x86)\Microsoft Visual Studio 8\VC\bin\cl.exe"
          if (-not (Test-Path $cl)) {
            Write-Error "cl.exe not found at $cl"
            exit 1
          }
          & $cl /?
          Write-Host "MSVC 2005 compiler verified"

      # ── 5. Clone Chromium ───────────────────────────────────────
      - name: Clone Chromium @ 4db48af7
        uses: actions/checkout@v4
        with:
          repository: chromium/chromium
          ref: "4db48af7ca622fe2b6d521abd7116f76e3d9ecb1"
          fetch-depth: 1
          path: chromium

      - name: Show Chromium contents
        shell: pwsh
        run: |
          Get-Content "chromium\chrome\VERSION" -ErrorAction SilentlyContinue
          Get-ChildItem "chromium" -Name | Select-Object -First 20

      # ── 6. (Placeholder) Build ──────────────────────────────────
      - name: Build (placeholder)
        shell: pwsh
        run: |
          Write-Host "TODO: add build steps"
          # You'll need:
          #   - Python 2.7 (not pre-installed)
          #   - The correct SCons entry point for this commit
          #   - Third-party deps (WebKit, V8, etc.)
          #   - MSVC 2005 environment variables (vsvars32.bat)
