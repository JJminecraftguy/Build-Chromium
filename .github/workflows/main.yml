name: build-chrome-0.2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 360

    steps:
      # ── 1. Free disk space ──────────────────────────────────────
      - name: Remove pre-installed toolchains
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force "C:\Program Files\Microsoft Visual Studio\2022" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Android" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\dotnet" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "$env:AGENT_TOOLSDIRECTORY" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\Google\Chrome" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files (x86)\Microsoft\EdgeCore" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\Mozilla Firefox" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\Java" -ErrorAction SilentlyContinue
          Remove-Item -Recurse -Force "C:\Program Files\Eclipse Adoptium" -ErrorAction SilentlyContinue
          Write-Host "Freed space:"
          Get-PSDrive C | Select-Object Used, Free

      # ── 2. Enable .NET 3.5 ──────────────────────────────────────
      - name: Enable .NET 3.5
        shell: pwsh
        run: |
          DISM /Online /Enable-Feature /FeatureName:NetFx3 /All /NoRestart
          Write-Host ".NET 3.5 enabled"
          
      # ── 1. Install Go (required by setup-msvc v1.1.0) ──────────
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      # ── 1. Setup MSVC 2005 SP1 (minimal components) ────────────
      - name: Setup MSVC 2005 SP1
        uses: jaenster/setup-msvc@v1
        with:
          version: '14.00.50727.762'

      - name: Verify compiler
        shell: pwsh
        run: cl.exe /?

      - name: Cache DX9 headers
        uses: actions/cache@v4
        with:
          path: dx9-sdk
          key: dx9-sdk-dec2006
          restore-keys: dx9-sdk-

      - name: Extract DirectX 9.0c SDK headers (Dec 2006)
        if: steps.cache-dx9.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          curl.exe -L -o "$env:RUNNER_TEMP\dxsdk_dec2006.exe" `
            "https://archive.org/download/dxsdk_dec2006/dxsdk_dec2006.exe"

          # Step 1: Extract the inner .cab from the PE self-extractor
          7z x "$env:RUNNER_TEMP\dxsdk_dec2006.exe" -o"$env:RUNNER_TEMP\dx_cab" -y

          # Find the cab (it may be named CABINET or have an extension)
          $cab = Get-ChildItem "$env:RUNNER_TEMP\dx_cab" -Filter "*.cab" -Recurse | Select-Object -First 1
          if (-not $cab) {
            $cab = Get-ChildItem "$env:RUNNER_TEMP\dx_cab" -Recurse | Where-Object { $_.Length -gt 100MB } | Select-Object -First 1
          }
          Write-Host "CAB: $($cab.FullName) ($([math]::Round($cab.Length/1MB,1)) MB)"

          # Step 2: Extract only Include and Lib from the cab
          7z x $cab.FullName "Include" -o"$env:RUNNER_TEMP\dx" -y
          7z x $cab.FullName "Lib" -o"$env:RUNNER_TEMP\dx" -y

          # Cleanup
          Remove-Item "$env:RUNNER_TEMP\dxsdk_dec2006.exe" -Force
          Remove-Item "$env:RUNNER_TEMP\dx_cab" -Recurse -Force

          # Move to cache path
          Move-Item "$env:RUNNER_TEMP\dx" "dx9-sdk"

          # Verify
          $d3d9 = Get-ChildItem "dx9-sdk" -Recurse -Filter "d3d9.h" | Select-Object -First 1
          if ($d3d9) {
            Write-Host "Found d3d9.h at: $($d3d9.FullName)"
          } else {
            Write-Host "d3d9.h NOT found. Contents:"
            Get-ChildItem "dx9-sdk" -Recurse -Depth 2 | ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }

      - name: Set DX9 env vars
        shell: pwsh
        run: |
          echo "INCLUDE=$PWD\dx9-sdk\Include;$($env:INCLUDE)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          echo "LIB=$PWD\dx9-sdk\Lib;$($env:LIB)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Test-Path "$PWD\dx9-sdk\Include\d3d9.h"
          
      # ── 3. Clone Chromium ───────────────────────────────────────
      - name: Clone Chromium @ 4db48af7
        uses: actions/checkout@v4
        with:
          repository: chromium/chromium
          ref: "4db48af7ca622fe2b6d521abd7116f76e3d9ecb1"
          fetch-depth: 1
          path: chromium

      - name: Show Chromium contents
        shell: pwsh
        run: |
          Get-Content "chromium\chrome\VERSION" -ErrorAction SilentlyContinue
          Get-ChildItem "chromium" -Name | Select-Object -First 20

      # ── 4. (Placeholder) Build ──────────────────────────────────
      - name: Build (placeholder)
        shell: pwsh
        run: |
          Write-Host "TODO: add build steps"
          # You'll need:
          #   - Python 2.7 (not pre-installed)
          #   - The correct SCons entry point for this commit
          #   - Third-party deps (WebKit, V8, etc.)
