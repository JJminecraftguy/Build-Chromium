name: Fetch 2008 Chromium deps
on: [workflow_dispatch]

jobs:
  fetch:
    runs-on: windows-latest
    steps:
      - name: Setup SVN (for svndump fallback)
        uses: AmpScm/setup-subversion@v1

      - name: Install Python 2.5.4
        run: |
          Start-BitsTransfer -Source "https://www.python.org/ftp/python/2.5.4/python-2.5.4.msi" -Destination "$env:RUNNER_TEMP\py254.msi"
          msiexec /i "$env:RUNNER_TEMP\py254.msi" /qn TARGETDIR="C:\Python25"
          echo "C:\Python25" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          echo "C:\Python25\Scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: powershell
        
      - name: Breakpad @ 2d7664e8 (pruned)
        run: |
          git clone --filter=blob:none --no-tags --single-branch -b main --no-checkout https://github.com/google/breakpad.git breakpad
          cd breakpad
          git checkout 2d7664e8d477816e0641e822752f63982c1be74f
          git branch -f main 2d7664e8d477816e0641e822752f63982c1be74f
          git gc --aggressive --prune=now
          Copy-Item -Recurse . ..\src\breakpad\src
        shell: powershell

      - name: Googletest @ 26ddf828 (pruned)
        run: |
          git clone --filter=blob:none --no-tags --single-branch -b master --no-checkout https://github.com/stp/googletest.git googletest
          cd googletest
          git checkout 26ddf828fa2870982315f4dc8dd4f6e4777f4d29
          git branch -f main 26ddf828fa2870982315f4dc8dd4f6e4777f4d29
          git gc --aggressive --prune=now
          Copy-Item -Recurse . ..\src\testing\gtest
        shell: powershell

      - name: V8 @ 4de96712 (pruned)
        run: |
          git clone --filter=blob:none --no-tags --single-branch -b main --no-checkout https://chromium.googlesource.com/v8/v8.git v8
          cd v8
          git checkout 4de96712f4295f4e5deaadc5d8a7429889eee00b
          git branch -f main 4de96712f4295f4e5deaadc5d8a7429889eee00b
          git gc --aggressive --prune=now
          Copy-Item -Recurse . ..\src\v8
        shell: powershell

      - name: WebKit LayoutTests @ Safari-3-1-branch r31256
        run: |
          git clone --filter=blob:none --no-tags --single-branch -b Safari-3-1-branch --no-checkout https://webkit.googlesource.com/WebKit WebKit
          cd WebKit
          $found = @(git log --all --grep="git-svn-id.*@31256 " --format="%H %ad" --date=short)
          Write-Host ">>> WebKit: $($found.Count) match(es)"
          foreach ($m in $found) { Write-Host "    $m" }
          $commit = ($found[0] -split ' ')[0]
          Write-Host ">>> Checking out: $commit"
          git checkout $commit
          git branch -f main $commit
          git gc --aggressive --prune=now
          Copy-Item -Recurse "LayoutTests" ..\src\webkit\data\layout_tests
        shell: powershell

      - name: Google URL @ SVN r92 (svndump fallback)
        run: |
          Invoke-WebRequest -Uri "https://storage.googleapis.com/google-code-archive-source/v2/code.google.com/google-url/repo.svndump.gz" -OutFile "$env:RUNNER_TEMP\google-url.svndump.gz"
          7z x "$env:RUNNER_TEMP\google-url.svndump.gz" -o"$env:RUNNER_TEMP" -y
          svnadmin create "$env:RUNNER_TEMP\google-url-svn"
          svnadmin load "$env:RUNNER_TEMP\google-url-svn" < "$env:RUNNER_TEMP\google-url.svndump"
          svn checkout "file:///$($env:RUNNER_TEMP.Replace('\','/'))/google-url-svn/trunk@92" src\googleurl
        shell: powershell

      - name: Chromium trunk deps (icu38@1227, WebKit@19)
        run: |
          git clone --filter=blob:none --no-tags --no-checkout https://chromium.googlesource.com/chromium/src.git src
          cd src
          $found = @(git log --all --grep="git-svn-id.*@1227 " --format="%H %ad" --date=short -- third_party/icu38)
          Write-Host ">>> Chromium icu38: $($found.Count) match(es)"
          foreach ($m in $found) { Write-Host "    $m" }
          $commit = ($found[0] -split ' ')[0]
          Write-Host ">>> Checking out: $commit"
          git checkout $commit -- third_party/icu38
          git branch -f main $commit
          git gc --aggressive --prune=now
          Copy-Item -Recurse third_party\icu38 ..\..\src\third_party\icu38
        shell: powershell
